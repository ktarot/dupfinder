# 테스트 → 실행 파일(.exe) 빌드.
# - main 브랜치에 올릴 때마다: 빌드 결과를 Actions 실행 화면의 Artifacts에 올림
# - v로 시작하는 태그(예: v0.1.0)를 올리면: GitHub Releases에 DupFinder.exe 게시
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 테스트
        run: python -m unittest discover -s tests -v

      - name: 실행 파일 빌드
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DupFinder
          --collect-binaries blake3 app.py

      - name: 빌드 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: DupFinder-windows
          path: dist/DupFinder.exe

      - name: 릴리스 게시(태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DupFinder.exe
          generate_release_notes: true
